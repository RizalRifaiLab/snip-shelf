[package]
name = "snip-shelf"
version = "1.3.0"
edition = "2021"
description = "A clipboard, screenshot and screen-recording history for macOS"
license = "MIT"

[[bin]]
name = "snip-shelf"
path = "src/main.rs"

[dependencies]
# Only what Snip Shelf needs: the lighter OpenGL renderer, clipboard in text fields,
# and on-demand system fonts (no bundled fonts, no 3D engine).
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "system_fonts"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.10"
objc2 = "0.6"
winit = "0.30"
tray-icon = "0.26"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
