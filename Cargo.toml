[package]
name = "snip-shelf"
version = "1.2.0"
edition = "2021"
description = "A clipboard, screenshot and screen-recording history for macOS"
license = "MIT"

[[bin]]
name = "snip-shelf"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.10"
objc2 = "0.6"
winit = "0.30"
tray-icon = "0.26"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
